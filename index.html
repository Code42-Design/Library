<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Library - Interactive Drag & Drop Bookshelf</title>
  <style>
    :root {
      --bg-color: #121318;
      --card-bg: #1e2029;
      --shelf-wood: #2c1d11;
      --shelf-wood-top: #422a18;
      --accent: #d4a373;
      --accent-light: #fefae0;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid #333;
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 1rem;
    }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .shelves-container {
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    .shelf {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    .shelf-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .shelf-title {
      font-size: 1.2rem;
      color: var(--accent-light);
    }

    .books-row {
      display: flex;
      gap: 1.2rem;
      align-items: flex-end;
      min-height: 180px;
      padding: 1rem 0.5rem;
      background: linear-gradient(to bottom, transparent 88%, var(--shelf-wood-top) 88%, var(--shelf-wood) 100%);
      border-bottom: 12px solid var(--shelf-wood);
      overflow-x: auto;
    }

    .books-row.drag-over {
      background: rgba(212, 163, 115, 0.1);
      border-color: var(--accent);
    }

    .book {
      width: 110px;
      height: 160px;
      border-radius: 4px 8px 8px 4px;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      user-select: none;
      box-shadow: -4px 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .book:active {
      cursor: grabbing;
    }

    .book.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }

    .book-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      line-height: 1.2;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .book-author {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.8);
    }

    .book-actions {
      position: absolute;
      top: 5px;
      right: 5px;
      display: none;
    }

    .book:hover .book-actions {
      display: block;
    }

    .action-btn {
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lumina Library</h1>
    <div class="controls">
      <button onclick="addSampleBook()">+ Add Book</button>
    </div>
  </header>

  <div class="shelves-container">
    <div class="shelf">
      <div class="shelf-header">
        <span class="shelf-title">📖 Currently Reading</span>
      </div>
      <div class="books-row" id="shelf-reading" data-shelf="reading" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)"></div>
    </div>

    <div class="shelf">
      <div class="shelf-header">
        <span class="shelf-title">✨ Want to Read</span>
      </div>
      <div class="books-row" id="shelf-wishlist" data-shelf="wishlist" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)"></div>
    </div>

    <div class="shelf">
      <div class="shelf-header">
        <span class="shelf-title">✅ Finished</span>
      </div>
      <div class="books-row" id="shelf-completed" data-shelf="completed" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)"></div>
    </div>
  </div>

  <script>
    let books = [
      { id: '1', title: 'Dune', author: 'Frank Herbert', shelf: 'reading', color: '#2b4c3f' },
      { id: '2', title: '1984', author: 'George Orwell', shelf: 'reading', color: '#7a2e2e' },
      { id: '3', title: 'The Hobbit', author: 'J.R.R. Tolkien', shelf: 'wishlist', color: '#3a5a78' },
      { id: '4', title: 'Foundation', author: 'Isaac Asimov', shelf: 'completed', color: '#5a3a78' }
    ];

    let draggedBookId = null;

    function renderBooks() {
      ['reading', 'wishlist', 'completed'].forEach(shelfKey => {
        const row = document.getElementById(`shelf-${shelfKey}`);
        row.innerHTML = '';
        
        books.filter(b => b.shelf === shelfKey).forEach(book => {
          const el = document.createElement('div');
          el.className = 'book';
          el.style.backgroundColor = book.color;
          el.draggable = true;
          el.dataset.id = book.id;

          el.innerHTML = `
            <div class="book-title">${book.title}</div>
            <div class="book-author">${book.author}</div>
            <div class="book-actions">
              <button class="action-btn" onclick="removeBook('${book.id}')">✕</button>
            </div>
          `;

          el.addEventListener('dragstart', handleDragStart);
          el.addEventListener('dragend', handleDragEnd);

          row.appendChild(el);
        });
      });
    }

    function handleDragStart(e) {
      draggedBookId = this.dataset.id;
      this.classList.add('dragging');
      e.dataTransfer.setData('text/plain', draggedBookId);
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
      draggedBookId = null;
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      const row = e.currentTarget;
      row.classList.remove('drag-over');

      const newShelf = row.dataset.shelf;
      const book = books.find(b => b.id === draggedBookId);

      if (book) {
        book.shelf = newShelf;
        renderBooks();
      }
    }

    function addSampleBook() {
      const titles = ['Neuromancer', 'Hyperion', 'Snow Crash', 'Project Hail Mary'];
      const authors = ['William Gibson', 'Dan Simmons', 'Neal Stephenson', 'Andy Weir'];
      const colors = ['#8c5221', '#21688c', '#62218c', '#218c5d'];
      
      const idx = Math.floor(Math.random() * titles.length);
      
      books.push({
        id: Date.now().toString(),
        title: titles[idx],
        author: authors[idx],
        shelf: 'wishlist',
        color: colors[idx]
      });

      renderBooks();
    }

    function removeBook(id) {
      books = books.filter(b => b.id !== id);
      renderBooks();
    }

    // Initial Render
    renderBooks();
  </script>
</body>
</html>
